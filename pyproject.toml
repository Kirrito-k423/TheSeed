[build-system]
requires = ["hatchling", "hatch-nightly"]
build-backend = "hatchling.build"

[project]
name = "the-seed"
version = "0.1.0"
description = "🌱 The Seed - Next-generation AI Agent framework for everyone"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Kirrito-k423", email = "kirrito@example.com" }
]
keywords = ["ai", "agent", "llm", "gpt", "claude", "openai", "chatbot", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"

dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
anthropic = ["anthropic>=0.25.0"]
google = ["google-generativeai>=0.8.0"]
azure = ["openai>=1.0"]
all = [
    "anthropic>=0.25.0",
    "google-generativeai>=0.8.0",
    "openai>=1.0",
]

[project.scripts]
seed = "seed.cli:main"

[project.urls]
Homepage = "https://github.com/Kirrito-k423/TheSeed"
Documentation = "https://kirrito-k423.github.io/TheSeed"
Repository = "https://github.com/Kirrito-k423/TheSeed"
Issues = "https://github.com/Kirrito-k423/TheSeed/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/seed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio-mode = "auto"